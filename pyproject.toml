[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "zovak-backend"
version = "0.1.0"
description = "ZOVAK Python-first AI receptionist and scheduling backend foundation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.9,<3", "pydantic-settings>=2.5,<3", "httpx>=0.27,<1",
  "openai>=2.0,<4", "openai-agents>=0.5,<1", "aiosqlite>=0.20,<1",
  "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.30,<1", "alembic>=1.13,<2",
  "cryptography>=44,<50", "aiortc>=1.9,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["zovak"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
